# Public read-only dashboard, rebuilt on every push to main (including the bot's hourly ledger commits).
# The export needs no API keys and only python-dotenv beyond the standard library.
[build]
  command = "pip install python-dotenv==1.0.1 && python -m src.site_export"
  publish = "site"

[build.environment]
  PYTHON_VERSION = "3.11"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-cache"

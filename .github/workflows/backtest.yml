name: Backtest

# Run by hand from the Actions tab ("Run workflow"). Replays every Congress buy in the ledger through the
# current rules and commits reports/backtest.md and reports/backtest.json. Never places trades.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-pipeline
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run backtest
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: "true"
          DB_PATH: "data/ledger.db"
        run: python -m src.backtest
      - name: Commit report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/backtest.md reports/backtest.json
          git diff --staged --quiet || (git commit -m "backtest: update report" && git pull --rebase && git push)

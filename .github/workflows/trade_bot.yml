name: Congressional Trade Execution Pipeline

on:
  # Started by a Zapier schedule ("Congressional Trade Agent - Hourly Run") at :17 past each hour,
  # 8:17 AM-5:17 PM ET on market days (weekends and NYSE holidays skipped). GitHub's own cron was
  # unreliable, so it is not used. Run by hand from the Actions tab with "Run workflow".
  workflow_dispatch:

permissions:
  contents: write

# Never let two runs touch the ledger at once.
concurrency:
  group: trade-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Pipeline Engine
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: "true"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRACEFOUR_API_KEY: ${{ secrets.TRACEFOUR_API_KEY }}
          DB_PATH: "data/ledger.db"
          # Mirror buys from every House member, not just TARGET_MEMBERS (all are still subject to the entry rules).
          CONGRESS_MIRROR_ALL_MEMBERS: "true"
        run: python -m src.main

      - name: Commit Updated Ledger & Journal Back to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ledger.db logs/trade_journal.md
          git diff --staged --quiet || (git commit -m "auto: update database ledger and trade journal" && git push)
